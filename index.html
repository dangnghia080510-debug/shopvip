<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mướp Chat</title>
<meta name="theme-color" content="#0084ff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mướp Chat"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--pn:#f0f2f5;--t:#050505;--s:#65676b;--g:#0084ff;--gl:#e7f3ff;--in:#f0f0f0;--ln:#e4e6eb;--sh:0 8px 30px rgba(0,0,0,.15)}
[data-theme=dark]{--bg:#18191a;--pn:#3a3b3c;--t:#e4e6eb;--s:#b0b3b8;--g:#2d88ff;--gl:#263951;--in:#303030;--ln:#3e4042;--sh:0 8px 30px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 "Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--t);transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:50%;width:38px;height:38px;font-size:18px;flex:none}
button:hover{background:var(--pn)}
input,textarea{background:var(--pn);border:1px solid transparent;border-radius:22px;padding:10px 16px;outline:0;width:100%}
input:focus,textarea:focus{border-color:var(--g)}
[hidden]{display:none!important}
.pri{background:var(--g);color:#fff;border-radius:22px;width:100%;height:44px;font-weight:600;font-size:15px}
.pri:hover{background:var(--g);filter:brightness(1.1)}
.card{background:var(--bg);border-radius:20px;padding:26px;width:min(400px,92vw);box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}
#auth,#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--pn);z-index:20}
#modal{background:rgba(0,0,0,.45);z-index:30}
#auth .logo{font-size:44px;text-align:center}
#auth h1{text-align:center}
#auth p,.er{text-align:center;color:var(--s)}
.er{color:#dc2626;min-height:18px;font-size:13px}
#auth a{text-align:center;color:var(--g);cursor:pointer;font-weight:500}
#app{display:flex;height:100dvh;overflow:hidden}
#side{width:360px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:10px;padding:12px 0 0;flex:none}
#side>*{margin-inline:12px}
#side>input{width:calc(100% - 24px)}
.top{display:flex;align-items:center;gap:8px}
.top b{flex:1;font-size:24px;font-weight:700}
#meBtn{cursor:pointer}
#onl{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
#onl div{text-align:center;font-size:11px;width:54px;flex:none;cursor:pointer;position:relative}
#onl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list{flex:1;overflow:auto;margin:0;padding:0 6px}
.it{display:flex;gap:12px;align-items:center;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.it:hover{background:var(--pn)}.it.act{background:var(--gl)}
.avw{position:relative;flex:none}
.dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid var(--bg)}
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.av.grp{background:var(--g)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid b,.mid small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--s);font-size:13px}.mid small.un{color:var(--t);font-weight:700}
.rt{display:flex;gap:4px;align-items:center;font-size:12px}
.ub{width:10px;height:10px;border-radius:50%;background:var(--g)}
.emp{text-align:center;color:var(--s);padding:30px 16px}
.vb{width:15px;height:15px;vertical-align:-2px;margin-left:3px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#empty{margin:auto;color:var(--s);text-align:center}
#empty div{font-size:56px}
#chat{display:flex;flex-direction:column;height:100%}
#hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
#back{display:none}
#sbar{padding:8px 14px;border-bottom:1px solid var(--ln)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.row.me{flex-direction:row-reverse}
.aw{width:28px;flex:none}
.col{display:flex;flex-direction:column;max-width:72%}
.row.me .col{align-items:flex-end}
.nm{color:var(--s);font-size:12px;margin:6px 0 2px 10px}
.b{background:var(--in);padding:8px 14px;border-radius:20px;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.row.me .b{background:linear-gradient(135deg,#00a2ff,#0066ff);color:#fff}
.row .b{border-radius:4px 18px 18px 4px}.row.g1 .b{border-top-left-radius:18px}.row.gl .b{border-bottom-left-radius:18px}
.row.me .b{border-radius:18px 4px 4px 18px}.row.me.g1 .b{border-top-right-radius:18px}.row.me.gl .b{border-bottom-right-radius:18px}
.b.img{padding:3px;background:none!important}
.b.rc{background:none!important;border:1px dashed var(--ln);color:var(--s)!important;font-style:italic}
.pic{max-width:min(320px,100%);max-height:420px;border-radius:16px;display:block;cursor:zoom-in}
.fl{color:inherit;text-decoration:none;display:flex;flex-direction:column}
.fl small{opacity:.75}
.tm{color:var(--s);font-size:11px;margin:2px 8px 6px;display:none}.row.gl .tm,.row.sel .tm{display:block}
.ac{display:none;gap:10px;font-size:12px;margin:0 8px 6px}
.ac a{color:var(--g);cursor:pointer;font-weight:500}
.row.sel .ac{display:flex}
#comp{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;border-top:1px solid var(--ln);position:relative}
#inp{resize:none;max-height:120px;height:40px;border-radius:20px}
#send{color:var(--g)}
#emo{position:absolute;bottom:62px;left:12px;background:var(--bg);box-shadow:var(--sh);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);width:min(320px,90vw)}
#emo button{width:100%;font-size:20px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--gl);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer}
.res .it{padding:6px}
.setrow{display:flex;gap:10px;align-items:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;align-items:center;justify-content:center}
#lb img{max-width:94vw;max-height:94dvh;border-radius:8px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:22px;z-index:50;box-shadow:var(--sh);max-width:90vw}
@media(max-width:760px){
#side{width:100%;border:0}
#main{position:fixed;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .25s ease;z-index:5}
#app.open #main{transform:none}
#back{display:block}
.col{max-width:80%}
}
#feedv{flex:1;overflow:auto;background:var(--pn);display:flex;flex-direction:column;gap:12px;padding:12px;align-items:center}
#feedv>*{width:min(640px,100%);flex:none}
.ftop{display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 12px;border-radius:12px}.ftop b{flex:1;font-size:20px}
.card2{background:var(--bg);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.12);margin-bottom:12px}
#feedv>.card2{margin:0}
.ph{display:flex;gap:10px;align-items:center;cursor:pointer}
.pt{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.pimg{width:100%;max-height:640px;object-fit:contain;background:var(--pn);border-radius:10px;cursor:zoom-in;display:block}
.shr{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:6px}
.pst{display:flex;justify-content:space-between;color:var(--s);font-size:13px;padding:8px 0;border-bottom:1px solid var(--ln)}
.pbar{display:flex;border-bottom:1px solid var(--ln)}
.pbar button{flex:1;border-radius:8px;width:auto;font-size:14px;color:var(--s);font-weight:600;height:36px}.pbar button.on{color:var(--g)}
.cmt{display:flex;gap:8px;margin-top:8px}.cmt .bx{background:var(--pn);border-radius:16px;padding:6px 12px;font-size:14px}
.cin{display:flex;gap:6px;margin-top:8px}.cin input{padding:8px 14px}
.qt{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:4px;font-size:12px;opacity:.85;cursor:pointer;text-align:left}
.mt{color:#bfe3ff;font-weight:600;cursor:pointer}.row:not(.me) .mt{color:var(--g)}
.ac{flex-wrap:wrap;align-items:center}.rx{display:flex;gap:2px}.rx button{width:30px;height:30px;font-size:16px}
.rcs{display:flex;gap:4px;margin:-4px 6px 4px}.rcs span{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:0 6px;font-size:12px;cursor:pointer}.rcs span.on{border-color:var(--g)}
#rpl{padding:6px 14px;border-top:1px solid var(--ln);font-size:13px;color:var(--s);display:flex;gap:8px;align-items:center}#rpl span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#rpl button{width:28px;height:28px;font-size:14px}
#sg{position:absolute;bottom:62px;left:60px;background:var(--bg);box-shadow:var(--sh);border-radius:12px;min-width:230px;z-index:6}#sg .it{padding:6px 10px}
.prof{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{flex-direction:column}
#nav{flex:none;background:var(--bg);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.nbar{padding:8px 14px 2px;font-size:24px;font-weight:700;color:var(--g)}
#tabs{display:flex}
#tabs button{flex:1;width:auto;height:44px;border-radius:0;font-size:14px;font-weight:600;color:var(--s);border-bottom:3px solid transparent}
#tabs button:not(.on) .ic{filter:grayscale(1);opacity:.7}
#tabs button.on{color:var(--g);border-color:var(--g)}
.nbd{display:inline-block;margin-left:5px;background:#e41e3f;color:#fff;border-radius:9px;font:700 11px/16px system-ui;min-width:16px;padding:0 4px;font-style:normal}
#feedv,#vMenu{flex:1;min-height:0}
#vChats{flex:1;min-height:0;display:flex}
#chat{flex:1;min-height:0;height:auto}
#vMenu{overflow:auto;background:var(--pn);padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
#vMenu>*{width:min(640px,100%);margin:0}
.mrow{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:16px;padding:14px}.mrow>b{flex:1;font-weight:600}
.card{position:relative}.x{position:absolute;top:8px;right:10px;z-index:1}
#prof{position:fixed;inset:0;z-index:25;background:var(--pn);overflow:auto}
.ph2{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--ln)}.ph2 b{font-size:18px}
#pbox{max-width:640px;margin:0 auto;padding:12px}
#pbox .prof{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:12px}
.lk{color:inherit;text-decoration:underline;word-break:break-all}
.chip.on{background:var(--g);color:#fff}
.sys{align-self:center;color:var(--s);font-size:12px;text-align:center;margin:8px 20px}
#adm{position:fixed;inset:0;z-index:25;background:var(--pn);overflow:auto}#abox{max-width:640px;margin:0 auto;padding:12px}
.sm{width:auto!important;padding:0 14px;border-radius:18px!important;font-size:14px;background:var(--pn)}.dgr{color:#dc2626}
</style>
</head>
<body>
<div id="auth">
 <form id="af" class="card">
  <div class="logo">🌿</div><h1>Mướp Chat</h1>
  <p id="sub">Đăng nhập để trò chuyện</p>
  <input id="dn" placeholder="Tên hiển thị" maxlength="40" hidden>
  <input id="un" placeholder="Username (a-z, 0-9, _ .)" autocomplete="username" maxlength="20">
  <input id="pw" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password">
  <div id="er" class="er"></div>
  <button class="pri" id="sb">Đăng nhập</button>
  <a id="sw">Chưa có tài khoản? Đăng ký</a>
 </form>
</div>

<div id="app" hidden>
 <nav id="nav"><div class="nbar">🌿 Mướp Chat</div><div id="tabs"><button data-t="home" class="on"><span class="ic">🏠</span> Bảng tin</button><button data-t="chats"><span class="ic">💬</span> Tin nhắn<i id="nb" class="nbd" hidden></i></button><button data-t="menu"><span class="ic">☰</span> Menu<i id="nbr" class="nbd" hidden></i></button></div></nav>
 <section id="feedv"></section>
 <section id="vMenu" hidden></section>
 <div id="vChats" hidden>
 <aside id="side">
  <div class="top"><div id="meBtn" title="Cài đặt"></div><b>Đoạn chat</b><button id="thm" title="Sáng/Tối">🌓</button><button id="newBtn" title="Cuộc trò chuyện mới">✏️</button></div>
  <input id="q" placeholder="Tìm cuộc trò chuyện">
  <div id="onl"></div>
  <div id="list"></div>
 </aside>
 <main id="main">
  <div id="empty"><div>🌿</div><p>Chọn một cuộc trò chuyện hoặc nhấn ✏️ để bắt đầu</p></div>
  <section id="chat" hidden>
   <div id="hd"></div>
   <div id="sbar" hidden><input id="ms" placeholder="Tìm tin nhắn trong cuộc trò chuyện"></div>
   <div id="msgs"></div><div id="rpl" hidden></div>
   <div id="comp">
    <div id="emo" hidden></div><div id="sg" hidden></div>
    <button id="pic" title="Gửi ảnh từ điện thoại">🖼️</button><button id="att" title="Gửi tệp">📎</button>
    <button id="emb" title="Emoji">😊</button>
    <textarea id="inp" rows="1" placeholder="Nhập tin nhắn..." maxlength="2000"></textarea>
    <button id="send" title="Gửi">➤</button>
    <input type="file" id="file" accept=".pdf,.txt,.zip,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.mp3" hidden><input type="file" id="file2" accept="image/*" multiple hidden>
   </div>
  </section>
 </main>
 </div>
</div>
<div id="modal" hidden></div>
<div id="adm" hidden><div class="ph2"><button id="aback" title="Quay lại">←</button><b>🛡️ Quản trị · Báo cáo vi phạm</b></div><div id="abox"></div></div>
<div id="prof" hidden><div class="ph2"><button id="pback" title="Quay lại">←</button><b>Trang cá nhân</b></div><div id="pbox"></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,getDocs,collection,query,where,orderBy,limit,onSnapshot,arrayUnion,deleteDoc,increment,deleteField,arrayRemove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDfsUpCSADUVAZLbC8cGZOahyKbdj0WYqA",
  authDomain:"muop-vip-2026.firebaseapp.com",
  projectId:"muop-vip-2026",
  storageBucket:"muop-vip-2026.firebasestorage.app",
  messagingSenderId:"182582189633",
  appId:"1:182582189633:web:9c655e0a35e5efe163f0c0"
};
const ADMIN="admin@muopchat.app"; // tài khoản username "admin" => tích xanh
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Nút Back của điện thoại: mỗi lớp (tab, chat, hồ sơ, popup, ảnh) = 1 mục lịch sử */
const ST=[],pend=[];let ign=0;
const hpush=k=>{if(ST.includes(k))return;ST.push(k);ign?pend.push(k):history.pushState({k},"")};
const hpop=k=>{const i=ST.lastIndexOf(k);if(i<0)return;const top=i===ST.length-1;ST.splice(i,1);const j=pend.lastIndexOf(k);if(j>=0)pend.splice(j,1);else if(top){ign++;history.back()}};
addEventListener("popstate",()=>{
  if(ign){if(--ign===0)pend.splice(0).forEach(k=>history.pushState({k},""));return}
  const k=ST.pop();
  if(k==="lb")$("#lb")?.remove();else if(k==="modal")closeModal();else if(k==="prof")closeProf();else if(k==="adm")closeAdm();else if(k==="chat")closeChat();else if(k==="tab")go("home");
});
const COMM={id:"community",community:true,isGroup:true,name:"Cộng đồng Mướp",members:[],lastAt:0,lastFrom:"",lastMsg:"Chat công khai cho mọi người",readAt:{},typing:{},pinned:{},muted:{}};
const isC=id=>id==="community",mcol=id=>isC(id)?collection(db,"community"):collection(db,"chats",id,"messages"),mref=(id,m)=>isC(id)?doc(db,"community",m):doc(db,"chats",id,"messages",m),getC=id=>isC(id)?COMM:C.find(x=>x.id===id);
let commSeen=0,me=null,U={},C=[],M=[],cur=null,watch={},mq="",t0=0,seenN={},lt=0,stick=true,uC,uM,timers=[];

const vb=v=>v?'<svg class="vb" viewBox="0 0 24 24" aria-label="Đã xác minh"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':"";
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const av=(u,z=40)=>u&&u.avatar&&u.avatar.startsWith("data:image/")?`<img class="av" style="width:${z}px;height:${z}px" src="${esc(u.avatar)}" alt="">`:`<div class="av" style="width:${z}px;height:${z}px;font-size:${z*.45}px;background:hsl(${hue(u?.username||"?")} 55% 40%)">${esc((u?.name||"?")[0].toUpperCase())}</div>`;
const grp=(z,e="👥")=>`<div class="av grp" style="width:${z}px;height:${z}px;font-size:${z*.45}px">${e}</div>`;
const on=u=>!!u&&Date.now()-(u.lastSeen||0)<45000;
const hm=d=>d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
const fmt=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?hm(d):d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"})+" "+hm(d)};
const toast=(m,f)=>{const e=document.createElement("div");e.id="toast";e.textContent=m;if(f){e.style.cursor="pointer";e.onclick=()=>{e.remove();f()}}document.body.append(e);setTimeout(()=>e.remove(),3500)};
const modal=h=>{const m=$("#modal");m.innerHTML=`<div class="card"><button class="x" id="mx" title="Đóng">✕</button>${h}</div>`;m.hidden=false;m.onclick=e=>{if(e.target===m)closeModal()};$("#mx").onclick=closeModal;hpush("modal")};
const closeModal=()=>{const m=$("#modal");if(m.hidden)return;m.hidden=true;hpop("modal")};
const other=c=>U[c.members.find(x=>x!==me.uid)];
const peer=c=>c.members.find(x=>x!==me.uid),bl=()=>U[me?.uid]?.blocked||[],isB=id=>bl().includes(id),isAdm=()=>!!U[me?.uid]?.verified,ownr=c=>c.createdBy||c.members[0];
let replyTo=null;
const unm=()=>{const m={};Object.values(U).forEach(u=>m[u.username]=u.id);return m};
const txt=t=>{const m=unm();return esc(t).replace(/@([a-z0-9_.]{3,20})/g,(a,n)=>m[n]?`<span class="mt" data-p="${m[n]}">@${n}</span>`:a).replace(/(https?:\/\/[^\s<]+)/g,u=>`<a class="lk" href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`)};

const OKEXT=/\.(pdf|txt|zip|docx?|xlsx?|pptx?|csv|mp3)$/i;
async function fit(f,max){for(const[z,q]of[[1800,.88],[1600,.82],[1400,.76],[1200,.7],[1000,.64],[800,.55]]){const d=await shrink(f,z,q);if(d.length<=max)return d}throw "Ảnh quá lớn, hãy chọn ảnh nhỏ hơn"}
function shrink(f,max,q){
  return new Promise((ok,no)=>{
    const im=new Image(),url=URL.createObjectURL(f);
    im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",q))};
    im.onerror=()=>no("Ảnh không hợp lệ");im.src=url;
  });
}
$("#file").onchange=async e=>{
  const fs=[...e.target.files].slice(0,10);e.target.value="";if(!cur)return;
  for(const f of fs)try{
    if(f.type.startsWith("image/")){
      if(!/^image\/(jpeg|png|gif|webp)$/.test(f.type))throw "Chỉ hỗ trợ ảnh JPG, PNG, GIF, WEBP";
      if(f.size>10*1048576)throw "Ảnh tối đa 10MB";
      const d=await fit(f,900000);
      await send({type:"image",data:d,name:f.name.slice(0,60)});
    }else{
      if(!OKEXT.test(f.name))throw "Loại tệp không được hỗ trợ (pdf, txt, zip, doc, xls, ppt, csv, mp3)";
      if(f.size>600*1024)throw "Tệp tối đa 600KB";
      const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
      await send({type:"file",data:d,name:f.name.slice(0,60),size:f.size});
    }
  }catch(x){toast(typeof x==="string"?x:"Gửi tệp thất bại")}
};

/* ---------- Tạo chat ---------- */
const base={isGroup:false,lastMsg:"",lastAt:0,lastFrom:"",typing:{},readAt:{},pinned:{},muted:{}};
async function start11(uid){
  if(isB(uid))return toast("Bạn đã chặn người này. Hãy bỏ chặn để nhắn tin");
  if(U[uid]?.blocked?.includes(me.uid))return toast("Không thể nhắn tin cho người này");
  const id=[me.uid,uid].sort().join("_"),ref=doc(db,"chats",id);
  try{
    if(!(await getDoc(ref)).exists())await setDoc(ref,{...base,members:[me.uid,uid].sort(),createdBy:me.uid,lastAt:Date.now()});
    closeModal();openChat(id);
  }catch(e){toast("Không tạo được cuộc trò chuyện: "+(e.code||""))}
}
function newChat(){
  const sel=new Map();
  modal(`<h3>Cuộc trò chuyện mới</h3><input id="us" placeholder="Tìm người dùng theo username" autocomplete="off"><div id="chips" class="chips"></div><div id="res"></div><input id="gn" placeholder="Tên nhóm" maxlength="40" hidden><button class="pri" id="go">Bắt đầu</button><small style="color:var(--s)">Chọn 1 người để chat riêng, từ 2 người để tạo nhóm.</small>`);
  const paint=()=>{$("#chips").innerHTML=[...sel.values()].map(u=>`<span class="chip" data-u="${u.id}">${esc(u.name)} ✕</span>`).join("");$("#gn").hidden=sel.size<2};
  let tm;
  $("#us").oninput=e=>{clearTimeout(tm);tm=setTimeout(async()=>{
    const q=e.target.value.trim().toLowerCase();if(q.length<2){$("#res").innerHTML="";return}
    $("#res").innerHTML='<p class="emp">Đang tìm...</p>';
    try{
      const s=await getDocs(query(collection(db,"users"),where("username",">=",q),where("username","<=",q+"\uf8ff"),limit(10)));
      const L=s.docs.filter(d=>d.id!==me.uid&&!isB(d.id)&&!(d.data().blocked||[]).includes(me.uid)).map(d=>({id:d.id,...d.data()}));L.forEach(u=>U[u.id]=u);
      $("#res").innerHTML=L.length?L.map(u=>`<div class="it" data-u="${u.id}">${av(u,40)}<div class="mid"><b>${esc(u.name)}${vb(u.verified)}</b><small>@${esc(u.username)}</small></div></div>`).join(""):'<p class="emp">Không tìm thấy người dùng</p>';
    }catch{$("#res").innerHTML='<p class="emp">Lỗi tìm kiếm, hãy thử lại</p>'}
  },300)};
  $("#res").onclick=e=>{const i=e.target.closest("[data-u]");if(i){sel.set(i.dataset.u,U[i.dataset.u]);paint()}};
  $("#chips").onclick=e=>{const i=e.target.closest("[data-u]");if(i){sel.delete(i.dataset.u);paint()}};
  $("#go").onclick=async()=>{
    if(!sel.size)return toast("Hãy chọn ít nhất một người");
    if(sel.size===1)return start11([...sel.keys()][0]);
    const n=$("#gn").value.trim()||"Nhóm "+[...sel.values()].map(u=>u.name).slice(0,2).join(", ");
    try{const r=await addDoc(collection(db,"chats"),{...base,isGroup:true,name:n.slice(0,40),members:[me.uid,...sel.keys()],createdBy:me.uid,lastAt:Date.now()});closeModal();openChat(r.id)}
    catch(e){toast("Không tạo được nhóm: "+(e.code||""))}
  };
  $("#us").focus();
}

function showReply(){const r=$("#rpl");r.hidden=!replyTo;if(replyTo)r.innerHTML=`<span>↩ Trả lời <b>${esc(U[replyTo.from]?.name||"")}</b>: ${esc(replyTo.text)}</span><button id="xr">✕</button>`}

let sgT;
function suggest(i){
  const m=i.value.slice(0,i.selectionStart).match(/@([a-z0-9_.]*)$/),g=$("#sg");
  if(!m){g.hidden=true;return}
  clearTimeout(sgT);sgT=setTimeout(async()=>{
    const q=m[1];let L=Object.values(U).filter(u=>u.id!==me.uid&&!isB(u.id)&&(u.username.startsWith(q)||u.name.toLowerCase().includes(q)));
    if(q)try{const r=await getDocs(query(collection(db,"users"),where("username",">=",q),where("username","<=",q+"\uf8ff"),limit(5)));r.docs.forEach(d=>{U[d.id]=U[d.id]||{id:d.id,...d.data()};if(d.id!==me.uid&&!L.some(x=>x.id===d.id))L.push(U[d.id])})}catch{}
    L=L.slice(0,5);g.hidden=!L.length;
    g.innerHTML=L.map(u=>`<div class="it" data-un="${esc(u.username)}">${av(u,28)}<div class="mid"><b>${esc(u.name)}${vb(u.verified)}</b><small>@${esc(u.username)}</small></div></div>`).join("");
  },200);
}
$("#sg").onclick=e=>{const i=e.target.closest("[data-un]");if(!i)return;const t=$("#inp"),c=t.selectionStart;t.value=t.value.slice(0,c).replace(/@([a-z0-9_.]*)$/,"@"+i.dataset.un+" ")+t.value.slice(c);$("#sg").hidden=true;t.focus()};

let tab="home",uF,pimg="",CM={},uCM={},openC=new Set(),drafts={},P=[],PP=[],uPP,profId=null;

function go(t){

$("#tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b)go(b.dataset.t)};

function drawMenu(){
  const u=U[me.uid];if(!u)return;

function initFeed(){
  $("#feedv").innerHTML=`<div class="card2"><div style="display:flex;gap:10px"><span id="pav">${av(U[me.uid],40)}</span><textarea id="ptx" rows="2" maxlength="3000" placeholder="Bạn đang nghĩ gì?" style="border-radius:14px"></textarea></div><div id="ppv"></div><div style="display:flex;gap:8px;margin-top:8px"><button id="pimgb" style="width:auto;padding:0 14px;border-radius:18px;font-size:14px;background:var(--pn)">📷 Ảnh</button><input type="file" id="pf" accept="image/*" hidden><button class="pri" id="ppost" style="width:auto;padding:0 22px;margin-left:auto">Đăng</button></div></div><div id="plist"></div>`;

    const f=e.target.files[0];e.target.value="";if(!f)return;
    if(!/^image\/(jpeg|png|gif|webp)$/.test(f.type))return toast("Chỉ hỗ trợ ảnh JPG, PNG, GIF, WEBP");

    catch(e){toast("Đăng bài thất bại: "+(e.code||""))}

  };
  uF=onSnapshot(query(collection(db,"posts"),orderBy("at","desc"),limit(30)),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));P.forEach(p=>{watchUser(p.from);p.shareOf&&watchUser(p.shareOf.from)});drawPosts()},e=>toast("Lỗi tải bảng tin: "+e.code));
}
function postHTML(p){
  const u=U[p.from],r=p.reactions||{},k={};Object.values(r).forEach(e=>k[e]=(k[e]||0)+1);
  const mine=r[me.uid],n=Object.keys(r).length,sh=p.shareOf,adm=U[me.uid]?.verified;
  return `<div class="card2 post" data-pid="${p.id}"><div class="ph" data-p="${p.from}">${av(u,40)}<div class="mid"><b>${esc(u?.name||"...")}${vb(u?.verified)}</b><small>${fmt(p.at)}${sh?" · đã chia sẻ":""}</small></div>${p.from!==me.uid?`<button data-pa="rep" title="Báo cáo bài viết">🚩</button>`:""}${p.from===me.uid||adm?`<button data-pa="del" title="Xóa bài">🗑</button>`:""}</div>${p.text?`<div class="pt">${txt(p.text)}</div>`:""}${imgH(p.img)}${sh?`<div class="shr"><div class="ph" data-p="${esc(sh.from)}">${av(U[sh.from],32)}<b>${esc(U[sh.from]?.name||"")}${vb(U[sh.from]?.verified)}</b></div>${sh.text?`<div class="pt">${txt(sh.text)}</div>`:""}${imgH(sh.img)}</div>`:""}<div class="pst"><span>${n?Object.keys(k).join("")+" "+n:""}</span><span>${p.cc>0?p.cc+" bình luận":""}${p.shares>0?" · "+p.shares+" chia sẻ":""}</span></div><div class="pbar"><button data-pa="like" class="${mine==="👍"?"on":""}">👍 Thích</button><button data-pa="heart" class="${mine==="❤️"?"on":""}">❤️ Tim</button><button data-pa="cm">💬 Bình luận</button><button data-pa="share">↪ Chia sẻ</button></div>${openC.has(p.id)?`<div>${(CM[p.id]||[]).filter(c=>!isB(c.from)).map(c=>`<div class="cmt"><span data-p="${c.from}" style="cursor:pointer">${av(U[c.from],30)}</span><div><div class="bx"><b data-p="${c.from}" style="cursor:pointer">${esc(U[c.from]?.name||"...")}${vb(U[c.from]?.verified)}</b><div>${txt(c.text)}</div></div><small style="color:var(--s)">${fmt(c.at)}${c.from!==me.uid?` · <a data-pa="rpc" data-cid="${c.id}" style="cursor:pointer">Báo cáo</a>`:""}${c.from===me.uid||adm?` · <a data-pa="dc" data-cid="${c.id}" style="cursor:pointer">Xóa</a>`:""}</small></div></div>`).join("")}<div class="cin"><input data-ci="${p.id}" placeholder="Viết bình luận... (@username để nhắc)" maxlength="500" value="${esc(drafts[p.id]||"")}"><button data-pa="send" style="color:var(--g)">➤</button></div></div>`:""}</div>`;
}
function keepFocus(box,f){
  const id=document.activeElement?.dataset?.ci;f();
  if(id){const n=box.querySelector(`[data-ci="${id}"]`);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
}
function drawPosts(){const l=$("#plist");if(!l)return;keepFocus(l,()=>l.innerHTML=vis().length?vis().map(postHTML).join(""):'<p class="emp">Chưa có bài viết nào. Hãy là người đăng đầu tiên!</p>')}
function subC(id){
  if(!openC.has(id)){uCM[id]&&uCM[id]();delete uCM[id];return}
  if(uCM[id])return;
  uCM[id]=onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("at","asc"),limit(50)),s=>{CM[id]=s.docs.map(d=>({id:d.id,...d.data()}));CM[id].forEach(c=>watchUser(c.from));redraw()});
}
document.addEventListener("click",async e=>{
  const im=e.target.closest(".pimg");if(im&&im.src){lightbox(im.src);return}
  const pa=e.target.closest("[data-pa]");
  if(pa){
    const el=pa.closest(".post"),pid=el?.dataset.pid,p=[...P,...PP].find(x=>x.id===pid),a=pa.dataset.pa;
    if(!p)return;const ref=doc(db,"posts",pid);
    if(a==="like"||a==="heart"){const em=a==="like"?"👍":"❤️";updateDoc(ref,{["reactions."+me.uid]:p.reactions?.[me.uid]===em?deleteField():em}).catch(()=>toast("Không thể thả cảm xúc"))}
    else if(a==="cm"){openC.has(pid)?openC.delete(pid):openC.add(pid);subC(pid);redraw()}
    else if(a==="send"){const inp=el.querySelector("[data-ci]"),t=inp.value.trim();if(!t)return;inp.value="";drafts[pid]="";try{await addDoc(collection(db,"posts",pid,"comments"),{from:me.uid,text:t.slice(0,500),at:Date.now()});updateDoc(ref,{cc:increment(1)}).catch(()=>{})}catch{toast("Không gửi được bình luận")}}
    else if(a==="dc"){deleteDoc(doc(db,"posts",pid,"comments",pa.dataset.cid)).then(()=>updateDoc(ref,{cc:increment(-1)})).catch(()=>toast("Không thể xóa"))}
    else if(a==="rep")reportModal({type:"post",targetId:pid,parentId:"",against:p.from,preview:(p.text||(p.img?"📷 Hình ảnh":"")||(p.shareOf?.text||"")).slice(0,300)});
    else if(a==="rpc"){const c=(CM[pid]||[]).find(x=>x.id===pa.dataset.cid);c&&reportModal({type:"comment",targetId:c.id,parentId:pid,against:c.from,preview:c.text.slice(0,300)})}
    else if(a==="del"){if(confirm("Xóa bài viết này?"))deleteDoc(ref).catch(()=>toast("Không thể xóa"))}
    else if(a==="share"){
      const cap=prompt("Viết gì đó về bài này (có thể bỏ trống):");if(cap===null)return;
      const b=p.shareOf||{id:pid,from:p.from,text:p.text||"",img:p.img||""};
      try{await addDoc(collection(db,"posts"),{from:me.uid,text:cap.slice(0,3000),at:Date.now(),reactions:{},cc:0,shares:0,shareOf:b});updateDoc(doc(db,"posts",b.id),{shares:increment(1)}).catch(()=>{});toast("Đã chia sẻ lên trang của bạn")}catch{toast("Chia sẻ thất bại")}
    }
    return;
  }
  const pp=e.target.closest("[data-p]");
  if(pp&&!e.target.closest("#msgs,#hd"))openProfile(pp.dataset.p);
});
document.addEventListener("input",e=>{const id=e.target.dataset?.ci;if(id)drafts[id]=e.target.value});

/* ---------- Trang cá nhân ---------- */
function openProfile(id){
  if(!id||id==="undefined"||!me)return;
  if(profId===id&&!$("#prof").hidden)return;
  profId=id;watchUser(id);uPP&&uPP();
  $("#prof").hidden=false;$("#prof").scrollTop=0;hpush("prof");
  PP=[];
  uPP=onSnapshot(query(collection(db,"posts"),where("from","==",id),limit(30)),s=>{PP=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);PP.forEach(p=>p.shareOf&&watchUser(p.shareOf.from));drawProf()},()=>{});
  drawProf();
}
function closeProf(){if($("#prof").hidden)return;$("#prof").hidden=true;uPP&&uPP();uPP=null;profId=null;hpop("prof")}
function drawProf(){
  const b=$("#pbox");if(!b||$("#prof").hidden||!profId)return;
  const u=U[profId];if(!u){b.innerHTML='<p class="emp">Đang tải...</p>';return}
  keepFocus(b,()=>{
    b.innerHTML=`<div class="prof">${av(u,88)}<h3>${esc(u.name)}${vb(u.verified)}</h3><small style="color:var(--s)">@${esc(u.username)} · ${on(u)?"🟢 Đang hoạt động":"Ngoại tuyến"}</small><div>${esc(u.status||"")}</div>${profId===me.uid?'<button class="pri" id="ps" style="width:auto;padding:0 20px">Chỉnh sửa hồ sơ</button>':(isB(profId)?"":'<button class="pri" id="pm" style="width:auto;padding:0 20px">💬 Nhắn tin</button> ')+`<button class="pri" id="pb" style="width:auto;padding:0 20px;${isB(profId)?"background:var(--pn);color:var(--t)":"background:#dc2626"}">${isB(profId)?"Bỏ chặn":"🚫 Chặn"}</button>`}</div><h4 style="margin:12px 0 8px">Bài viết</h4>${isB(profId)?'<p class="emp">Bạn đã chặn người dùng này</p>':PP.length?PP.map(postHTML).join(""):'<p class="emp">Chưa có bài viết nào</p>'}`;
    $("#pm")&&($("#pm").onclick=()=>start11(profId));
    $("#ps")&&($("#ps").onclick=settings);$("#pb")&&($("#pb").onclick=()=>setBlock(profId,!isB(profId)));
  });
}

/* ---------- Cài đặt ---------- */

  $("#sv").onclick=async()=>{
    const n=$("#sn").value.trim();if(!n)return toast("Tên không được để trống");
    try{await updateDoc(doc(db,"users",me.uid),{name:n.slice(0,40),status:$("#ss").value.trim().slice(0,80),avatar:nav});closeModal();toast("Đã lưu")}catch{toast("Lưu thất bại")}
  };
  $("#lo").onclick=async()=>{
    try{await updateDoc(doc(db,"users",me.uid),{lastSeen:0})}catch{}
    timers.forEach(clearInterval);await signOut(auth);location.reload();
  };
}

/* ---------- Chặn / Báo cáo / Admin / Quản lý nhóm ---------- */
let leaving=false,uR=null,RP=[],admTab="open";
const vis=()=>P.filter(p=>!isB(p.from)&&!(p.shareOf&&isB(p.shareOf.from)));
const canSend=c=>!c||c.isGroup||c.community||!U[peer(c)]?.blocked?.includes(me.uid);
function lockC(c){const k=!canSend(c);["#inp","#send","#att","#pic","#emb"].forEach(x=>$(x).disabled=k);$("#inp").placeholder=k?"Bạn không thể nhắn tin cho người này":"Nhập tin nhắn..."}
async function sysMsg(id,text){const t=Date.now();await addDoc(mcol(id),{from:me.uid,at:t,type:"sys",text,recalled:false,hiddenFor:[],reactions:{}});await updateDoc(doc(db,"chats",id),{lastMsg:text.slice(0,60),lastAt:t,lastFrom:me.uid,["readAt."+me.uid]:t})}
async function setBlock(id,on,q){
  if(!id||id===me.uid)return;const n=U[id]?.name||"người này";
  if(on&&!q&&!confirm(`Chặn ${n}?\nBạn sẽ không thấy bài viết, bình luận, tin nhắn của họ và họ không thể nhắn tin cho bạn.`))return;
  try{await updateDoc(doc(db,"users",me.uid),{blocked:on?arrayUnion(id):arrayRemove(id)});q||toast(on?"Đã chặn "+n:"Đã bỏ chặn "+n);
    if(on){const c=getC(cur);if(c&&!c.isGroup&&!c.community&&peer(c)===id)closeChat()}return true}
  catch{toast("Thao tác thất bại")}
}
function blockedList(){modal('<h3>🚫 Người đã chặn</h3><div id="bl"></div>');$("#bl").onclick=e=>{const i=e.target.closest("[data-ub]");if(i)setBlock(i.dataset.ub,false)};drawBlocked()}
function drawBlocked(){const b=$("#bl");if(!b)return;const L=bl();L.forEach(watchUser);
  b.innerHTML=L.length?L.map(id=>{const u=U[id];return `<div class="it" style="cursor:default">${av(u,40)}<div class="mid"><b>${esc(u?.name||"...")}</b><small>@${esc(u?.username||"")}</small></div><button class="sm" data-ub="${id}">Bỏ chặn</button></div>`}).join(""):'<p class="emp">Bạn chưa chặn ai</p>'}
function dmInfo(){const c=getC(cur),id=peer(c),u=U[id];if(!u)return;
  modal(`<div class="prof">${av(u,72)}<h3>${esc(u.name)}${vb(u.verified)}</h3><small style="color:var(--s)">@${esc(u.username)}</small></div><button class="pri" id="dv">👤 Xem trang cá nhân</button><button class="pri" id="db" style="background:#dc2626">🚫 Chặn người dùng</button>`);
  $("#dv").onclick=()=>{closeModal();openProfile(id)};$("#db").onclick=()=>{closeModal();setBlock(id,true)}}
const REASONS=["Spam","Quấy rối / xúc phạm","Nội dung nhạy cảm","Lừa đảo","Thông tin sai lệch","Khác"];
function reportModal(r){
  let reason="",blk=false;const n=U[r.against]?.name||"người này";
  modal(`<h3>🚩 Báo cáo vi phạm</h3><small style="color:var(--s)">Chọn lý do. Quản trị viên sẽ xem xét và gỡ nội dung nếu vi phạm.</small><div class="chips" id="rr">${REASONS.map(x=>`<span class="chip" data-rs="${x}">${x}</span>`).join("")}</div><textarea id="rn" rows="3" maxlength="300" placeholder="Mô tả thêm (không bắt buộc)" style="border-radius:14px"></textarea><div class="chips"><span class="chip" id="rb">🚫 Đồng thời chặn ${esc(n)}</span></div><button class="pri" id="rsend">Gửi báo cáo</button>`);
  $("#rr").onclick=e=>{const c=e.target.closest("[data-rs]");if(!c)return;reason=c.dataset.rs;document.querySelectorAll("#rr .chip").forEach(x=>x.classList.toggle("on",x===c))};
  $("#rb").onclick=()=>{blk=!blk;$("#rb").classList.toggle("on",blk)};
  $("#rsend").onclick=async()=>{if(!reason)return toast("Hãy chọn lý do");
    try{await setDoc(doc(db,"reports",`${r.type}_${r.targetId}_${me.uid}`),{...r,by:me.uid,reason,note:$("#rn").value.trim().slice(0,300),at:Date.now(),status:"open"});closeModal();toast("Đã gửi báo cáo. Cảm ơn bạn!");blk&&setBlock(r.against,true,1)}
    catch(e){toast("Không gửi được báo cáo: "+(e.code||""))}};
}
/* Admin */
const groups=()=>{const m=new Map();RP.forEach(r=>{const k=r.type+"_"+r.targetId;let g=m.get(k);if(!g)m.set(k,g={k,type:r.type,targetId:r.targetId,parentId:r.parentId,against:r.against,preview:r.preview,at:0,rs:[]});g.rs.push(r);g.at=Math.max(g.at,r.at)});return[...m.values()]};
const openN=()=>groups().filter(g=>g.rs.some(r=>r.status==="open")).length;
function watchReports(){if(uR||!isAdm())return;
  uR=onSnapshot(query(collection(db,"reports"),orderBy("at","desc"),limit(300)),s=>{RP=s.docs.map(d=>({id:d.id,...d.data()}));RP.forEach(r=>{watchUser(r.against);watchUser(r.by)});const n=openN();$("#nbr").hidden=!n;$("#nbr").textContent=n>9?"9+":n;tab==="menu"&&drawMenu();drawAdm()},e=>toast("Lỗi tải báo cáo: "+e.code))}
function openAdm(){if(!isAdm())return;watchReports();$("#adm").hidden=false;hpush("adm");drawAdm()}
function closeAdm(){if($("#adm").hidden)return;$("#adm").hidden=true;hpop("adm")}
$("#aback").onclick=closeAdm;
const TY={post:"📝 Bài viết",comment:"💬 Bình luận",message:"✉️ Tin nhắn"};
function drawAdm(){const b=$("#abox");if(!b||$("#adm").hidden)return;
  const G=groups().sort((a,c)=>c.at-a.at),op=G.filter(g=>g.rs.some(r=>r.status==="open")),L=admTab==="open"?op:G.filter(g=>!op.includes(g));
  b.innerHTML=`<div class="pbar" style="background:var(--bg);border-radius:12px;margin-bottom:12px"><button data-at="open" class="${admTab==="open"?"on":""}">Chờ xử lý (${op.length})</button><button data-at="done" class="${admTab==="done"?"on":""}">Đã xử lý (${G.length-op.length})</button></div>`+(L.length?L.map(g=>{const o=op.includes(g),u=U[g.against];return `<div class="card2" data-k="${esc(g.k)}"><b>${TY[g.type]||g.type}</b> · <small>${g.rs.length} báo cáo · ${fmt(g.at)}</small><div class="ph" data-p="${esc(g.against)}" style="margin:8px 0">${av(u,32)}<b>${esc(u?.name||"...")}${vb(u?.verified)}</b></div><div class="shr pt">${esc(g.preview||"(không có nội dung)")}</div>${g.rs.map(r=>`<div><small>${esc(U[r.by]?.name||"...")}: <b>${esc(r.reason)}</b>${r.note?" — "+esc(r.note):""}</small></div>`).join("")}<div style="display:flex;gap:8px;margin-top:10px">${o?'<button class="sm dgr" data-ac="rm">🗑 Gỡ nội dung</button><button class="sm" data-ac="ig">Bỏ qua</button>':`<small>${g.rs.some(r=>r.status==="removed")?"✅ Đã gỡ":"Đã bỏ qua"}</small>`}</div></div>`}).join(""):`<p class="emp">${admTab==="open"?"Không có báo cáo nào cần xử lý 🎉":"Chưa có báo cáo nào đã xử lý"}</p>`)}
$("#abox").onclick=e=>{const t=e.target.closest("[data-at]");if(t){admTab=t.dataset.at;drawAdm();return}
  const a=e.target.closest("[data-ac]");if(!a)return;const g=groups().find(x=>x.k===a.closest("[data-k]").dataset.k);if(!g)return;a.dataset.ac==="rm"?admRemove(g):resolveG(g,"dismissed")};
async function resolveG(g,st){try{await Promise.all(g.rs.filter(r=>r.status==="open").map(r=>updateDoc(doc(db,"reports",r.id),{status:st,handledBy:me.uid,doneAt:Date.now()})));toast(st==="removed"?"Đã gỡ nội dung vi phạm":"Đã bỏ qua báo cáo")}catch(e){toast("Không cập nhật được báo cáo: "+(e.code||""))}}
async function admRemove(g){if(!confirm("Gỡ nội dung vi phạm này?"))return;
  try{if(g.type==="post")await deleteDoc(doc(db,"posts",g.targetId));
    else if(g.type==="comment"){await deleteDoc(doc(db,"posts",g.parentId,"comments",g.targetId));updateDoc(doc(db,"posts",g.parentId),{cc:increment(-1)}).catch(()=>{})}
    else if(g.parentId==="community")await deleteDoc(doc(db,"community",g.targetId));
    else await updateDoc(doc(db,"chats",g.parentId,"messages",g.targetId),{recalled:true,removedByAdmin:true,text:"",data:""})}
  catch(e){if(e.code!=="not-found")return toast("Không thể gỡ: "+(e.code||""))}
  resolveG(g,"removed")}
/* Quản lý nhóm */
function groupInfo(){const c=getC(cur);if(!c||!c.isGroup||c.community)return;
  modal('<h3>👥 Quản lý nhóm</h3><div class="setrow"><input id="gnm" maxlength="40" placeholder="Tên nhóm"><button class="pri" id="gsv" style="width:auto;padding:0 18px;flex:none">Lưu</button></div><div id="gml"></div><button class="pri" id="gad" style="background:var(--pn);color:var(--t)">➕ Thêm thành viên</button><button id="glv" style="width:100%;border-radius:22px;color:#dc2626;font-size:15px">🚪 Rời nhóm</button>');
  $("#gnm").value=c.name;paintGroup();
  $("#gml").onclick=e=>{const i=e.target.closest("[data-rm]");if(i)removeMember(i.dataset.rm)};
  $("#gad").onclick=addMembers;$("#glv").onclick=leaveGroup;
  $("#gsv").onclick=async()=>{const n=$("#gnm").value.trim().slice(0,40),g=getC(cur);if(!n)return toast("Tên nhóm không được để trống");if(n===g.name)return toast("Tên nhóm chưa thay đổi");
    try{await updateDoc(doc(db,"chats",cur),{name:n});await sysMsg(cur,`${U[me.uid].name} đã đổi tên nhóm thành "${n}"`);toast("Đã đổi tên nhóm")}catch(e){toast("Không đổi được tên: "+(e.code||""))}}}
function paintGroup(){const c=getC(cur),b=$("#gml");if(!b||!c||!c.members)return;const o=ownr(c)===me.uid;
  b.innerHTML=`<b>${c.members.length} thành viên</b>`+c.members.map(id=>{watchUser(id);const u=U[id];return `<div class="it" style="cursor:default">${av(u,40)}<div class="mid"><b>${esc(u?.name||"...")}${vb(u?.verified)}${id===me.uid?" (Bạn)":""}</b><small>${id===ownr(c)?"Trưởng nhóm":"@"+esc(u?.username||"")}</small></div>${o&&id!==me.uid?`<button data-rm="${id}" title="Xóa khỏi nhóm" style="color:#dc2626">✕</button>`:""}</div>`}).join("")}
async function removeMember(id){const c=getC(cur),n=U[id]?.name||"thành viên";if(!c||ownr(c)!==me.uid||id===me.uid||!confirm(`Xóa ${n} khỏi nhóm?`))return;
  try{await sysMsg(cur,`${U[me.uid].name} đã xóa ${n} khỏi nhóm`);await updateDoc(doc(db,"chats",cur),{members:arrayRemove(id)})}catch(e){toast("Không xóa được: "+(e.code||""))}}
async function leaveGroup(){const c=getC(cur);if(!c||!confirm(`Rời nhóm "${c.name}"?`))return;
  const rest=c.members.filter(x=>x!==me.uid),id=cur;leaving=true;
  try{if(!rest.length){closeModal();closeChat();await deleteDoc(doc(db,"chats",id))}
    else{await sysMsg(id,`${U[me.uid].name} đã rời nhóm`);const up={members:arrayRemove(me.uid)};if(ownr(c)===me.uid)up.createdBy=rest[0];await updateDoc(doc(db,"chats",id),up);closeModal();closeChat();toast("Đã rời nhóm")}}
  catch(e){toast("Không rời được nhóm: "+(e.code||""))}
  leaving=false}
function addMembers(){const c=getC(cur);if(!c)return;const sel=new Map();
  modal('<h3>➕ Thêm thành viên</h3><input id="us" placeholder="Tìm người dùng theo username" autocomplete="off"><div id="chips" class="chips"></div><div id="res"></div><button class="pri" id="go">Thêm vào nhóm</button><button id="gbk" style="width:100%;border-radius:22px;font-size:15px">← Quay lại</button>');
  const paint=()=>$("#chips").innerHTML=[...sel.values()].map(u=>`<span class="chip" data-u="${u.id}">${esc(u.name)} ✕</span>`).join("");let tm;
  $("#us").oninput=e=>{clearTimeout(tm);tm=setTimeout(async()=>{const q=e.target.value.trim().toLowerCase();if(q.length<2){$("#res").innerHTML="";return}
    try{const r=await getDocs(query(collection(db,"users"),where("username",">=",q),where("username","<=",q+"\uf8ff"),limit(10)));
      const L=r.docs.filter(d=>!getC(cur).members.includes(d.id)&&!isB(d.id)&&!(d.data().blocked||[]).includes(me.uid)).map(d=>({id:d.id,...d.data()}));L.forEach(u=>U[u.id]=u);
      $("#res").innerHTML=L.length?L.map(u=>`<div class="it" data-u="${u.id}">${av(u,40)}<div class="mid"><b>${esc(u.name)}${vb(u.verified)}</b><small>@${esc(u.username)}</small></div></div>`).join(""):'<p class="emp">Không tìm thấy người dùng</p>'}
    catch{$("#res").innerHTML='<p class="emp">Lỗi tìm kiếm, hãy thử lại</p>'}},300)};
  $("#res").onclick=e=>{const i=e.target.closest("[data-u]");if(i){sel.set(i.dataset.u,U[i.dataset.u]);paint()}};
  $("#chips").onclick=e=>{const i=e.target.closest("[data-u]");if(i){sel.delete(i.dataset.u);paint()}};
  $("#gbk").onclick=groupInfo;
  $("#go").onclick=async()=>{const g=getC(cur),ids=[...sel.keys()].filter(i=>!g.members.includes(i));if(!ids.length)return toast("Hãy chọn ít nhất một người");if(g.members.length+ids.length>50)return toast("Nhóm tối đa 50 thành viên");
    try{await updateDoc(doc(db,"chats",cur),{members:arrayUnion(...ids)});await sysMsg(cur,`${U[me.uid].name} đã thêm ${ids.map(i=>U[i].name).join(", ")} vào nhóm`);toast("Đã thêm thành viên");groupInfo()}catch(e){toast("Không thêm được: "+(e.code||""))}};
  $("#us").focus()}
</script>
</body>
</html>
