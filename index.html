<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mướp Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--pn:#f0f2f5;--t:#050505;--s:#65676b;--g:#0084ff;--gl:#e7f3ff;--in:#f0f0f0;--ln:#e4e6eb;--sh:0 8px 30px rgba(0,0,0,.15)}
[data-theme=dark]{--bg:#18191a;--pn:#3a3b3c;--t:#e4e6eb;--s:#b0b3b8;--g:#2d88ff;--gl:#263951;--in:#303030;--ln:#3e4042;--sh:0 8px 30px rgba(0,0,0,.6)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 "Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--t);transition:background .25s,color .25s}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:50%;width:38px;height:38px;font-size:18px;flex:none}
button:hover{background:var(--pn)}
input,textarea{background:var(--pn);border:1px solid transparent;border-radius:22px;padding:10px 16px;outline:0;width:100%}
input:focus,textarea:focus{border-color:var(--g)}
[hidden]{display:none!important}
.pri{background:var(--g);color:#fff;border-radius:22px;width:100%;height:44px;font-weight:600;font-size:15px}
.pri:hover{background:var(--g);filter:brightness(1.1)}
.card{background:var(--bg);border-radius:20px;padding:26px;width:min(400px,92vw);box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px;max-height:90dvh;overflow:auto}
#auth,#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--pn);z-index:20}
#modal{background:rgba(0,0,0,.45);z-index:30}
#auth .logo{font-size:44px;text-align:center}
#auth h1{text-align:center}
#auth p,.er{text-align:center;color:var(--s)}
.er{color:#dc2626;min-height:18px;font-size:13px}
#auth a{text-align:center;color:var(--g);cursor:pointer;font-weight:500}
#app{display:flex;height:100dvh;overflow:hidden}
#side{width:360px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:10px;padding:12px 0 0;flex:none}
#side>*{margin-inline:12px}
#side>input{width:calc(100% - 24px)}
.top{display:flex;align-items:center;gap:8px}
.top b{flex:1;font-size:24px;font-weight:700}
#meBtn{cursor:pointer}
#onl{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
#onl div{text-align:center;font-size:11px;width:54px;flex:none;cursor:pointer;position:relative}
#onl span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list{flex:1;overflow:auto;margin:0;padding:0 6px}
.it{display:flex;gap:12px;align-items:center;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.it:hover{background:var(--pn)}.it.act{background:var(--gl)}
.avw{position:relative;flex:none}
.dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:#22c55e;border:2px solid var(--bg)}
.av{border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.av.grp{background:var(--g)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid b,.mid small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--s);font-size:13px}.mid small.un{color:var(--t);font-weight:700}
.rt{display:flex;gap:4px;align-items:center;font-size:12px}
.ub{width:10px;height:10px;border-radius:50%;background:var(--g)}
.emp{text-align:center;color:var(--s);padding:30px 16px}
.vb{width:15px;height:15px;vertical-align:-2px;margin-left:3px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#empty{margin:auto;color:var(--s);text-align:center}
#empty div{font-size:56px}
#chat{display:flex;flex-direction:column;height:100%}
#hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
#back{display:none}
#sbar{padding:8px 14px;border-bottom:1px solid var(--ln)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:100%;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.row.me{flex-direction:row-reverse}
.aw{width:28px;flex:none}
.col{display:flex;flex-direction:column;max-width:72%}
.row.me .col{align-items:flex-end}
.nm{color:var(--s);font-size:12px;margin:6px 0 2px 10px}
.b{background:var(--in);padding:8px 14px;border-radius:20px;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.row.me .b{background:linear-gradient(135deg,#00a2ff,#0066ff);color:#fff}
.row .b{border-radius:4px 18px 18px 4px}.row.g1 .b{border-top-left-radius:18px}.row.gl .b{border-bottom-left-radius:18px}
.row.me .b{border-radius:18px 4px 4px 18px}.row.me.g1 .b{border-top-right-radius:18px}.row.me.gl .b{border-bottom-right-radius:18px}
.b.img{padding:3px;background:none!important}
.b.rc{background:none!important;border:1px dashed var(--ln);color:var(--s)!important;font-style:italic}
.pic{max-width:min(320px,100%);max-height:420px;border-radius:16px;display:block;cursor:zoom-in}
.fl{color:inherit;text-decoration:none;display:flex;flex-direction:column}
.fl small{opacity:.75}
.tm{color:var(--s);font-size:11px;margin:2px 8px 6px;display:none}.row.gl .tm,.row.sel .tm{display:block}
.ac{display:none;gap:10px;font-size:12px;margin:0 8px 6px}
.ac a{color:var(--g);cursor:pointer;font-weight:500}
.row.sel .ac{display:flex}
#comp{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;border-top:1px solid var(--ln);position:relative}
#inp{resize:none;max-height:120px;height:40px;border-radius:20px}
#send{color:var(--g)}
#emo{position:absolute;bottom:62px;left:12px;background:var(--bg);box-shadow:var(--sh);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);width:min(320px,90vw)}
#emo button{width:100%;font-size:20px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--gl);border-radius:14px;padding:3px 10px;font-size:13px;cursor:pointer}
.res .it{padding:6px}
.setrow{display:flex;gap:10px;align-items:center}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:40;display:flex;align-items:center;justify-content:center}
#lb img{max-width:94vw;max-height:94dvh;border-radius:8px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:22px;z-index:50;box-shadow:var(--sh);max-width:90vw}
@media(max-width:760px){
#side{width:100%;border:0}
#main{position:fixed;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .25s ease;z-index:5}
#app.open #main{transform:none}
#back{display:block}
.col{max-width:80%}
}
#feedv{flex:1;overflow:auto;background:var(--pn);display:flex;flex-direction:column;gap:12px;padding:12px;align-items:center}
#feedv>*{width:min(640px,100%);flex:none}
.ftop{display:flex;align-items:center;gap:8px;background:var(--bg);padding:6px 12px;border-radius:12px}.ftop b{flex:1;font-size:20px}
.card2{background:var(--bg);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.12);margin-bottom:12px}
#feedv>.card2{margin:0}
.ph{display:flex;gap:10px;align-items:center;cursor:pointer}
.pt{margin:10px 0;white-space:pre-wrap;word-break:break-word}
.pimg{width:100%;max-height:640px;object-fit:contain;background:var(--pn);border-radius:10px;cursor:zoom-in;display:block}
.shr{border:1px solid var(--ln);border-radius:10px;padding:10px;margin-top:6px}
.pst{display:flex;justify-content:space-between;color:var(--s);font-size:13px;padding:8px 0;border-bottom:1px solid var(--ln)}
.pbar{display:flex;border-bottom:1px solid var(--ln)}
.pbar button{flex:1;border-radius:8px;width:auto;font-size:14px;color:var(--s);font-weight:600;height:36px}.pbar button.on{color:var(--g)}
.cmt{display:flex;gap:8px;margin-top:8px}.cmt .bx{background:var(--pn);border-radius:16px;padding:6px 12px;font-size:14px}
.cin{display:flex;gap:6px;margin-top:8px}.cin input{padding:8px 14px}
.qt{border-left:3px solid currentColor;padding:2px 8px;margin-bottom:4px;font-size:12px;opacity:.85;cursor:pointer;text-align:left}
.mt{color:#bfe3ff;font-weight:600;cursor:pointer}.row:not(.me) .mt{color:var(--g)}
.ac{flex-wrap:wrap;align-items:center}.rx{display:flex;gap:2px}.rx button{width:30px;height:30px;font-size:16px}
.rcs{display:flex;gap:4px;margin:-4px 6px 4px}.rcs span{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:0 6px;font-size:12px;cursor:pointer}.rcs span.on{border-color:var(--g)}
#rpl{padding:6px 14px;border-top:1px solid var(--ln);font-size:13px;color:var(--s);display:flex;gap:8px;align-items:center}#rpl span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#rpl button{width:28px;height:28px;font-size:14px}
#sg{position:absolute;bottom:62px;left:60px;background:var(--bg);box-shadow:var(--sh);border-radius:12px;min-width:230px;z-index:6}#sg .it{padding:6px 10px}
.prof{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="auth">
 <form id="af" class="card">
  <div class="logo">🌿</div><h1>Mướp Chat</h1>
  <p id="sub">Đăng nhập để trò chuyện</p>
  <input id="dn" placeholder="Tên hiển thị" maxlength="40" hidden>
  <input id="un" placeholder="Username (a-z, 0-9, _ .)" autocomplete="username" maxlength="20">
  <input id="pw" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" autocomplete="current-password">
  <div id="er" class="er"></div>
  <button class="pri" id="sb">Đăng nhập</button>
  <a id="sw">Chưa có tài khoản? Đăng ký</a>
 </form>
</div>

<div id="app" hidden>
 <aside id="side">
  <div class="top"><div id="meBtn" title="Cài đặt"></div><b>Đoạn chat</b><button id="thm" title="Sáng/Tối">🌓</button><button id="feedBtn" title="Bảng tin">📰</button><button id="newBtn" title="Cuộc trò chuyện mới">✏️</button></div>
  <input id="q" placeholder="Tìm cuộc trò chuyện">
  <div id="onl"></div>
  <div id="list"></div>
 </aside>
 <main id="main">
  <div id="empty"><div>🌿</div><p>Chọn một cuộc trò chuyện hoặc nhấn ✏️ để bắt đầu</p></div>
  <section id="feedv" hidden></section>
  <section id="chat" hidden>
   <div id="hd"></div>
   <div id="sbar" hidden><input id="ms" placeholder="Tìm tin nhắn trong cuộc trò chuyện"></div>
   <div id="msgs"></div><div id="rpl" hidden></div>
   <div id="comp">
    <div id="emo" hidden></div><div id="sg" hidden></div>
    <button id="att" title="Gửi ảnh/file">📎</button>
    <button id="emb" title="Emoji">😊</button>
    <textarea id="inp" rows="1" placeholder="Nhập tin nhắn..." maxlength="2000"></textarea>
    <button id="send" title="Gửi">➤</button>
    <input type="file" id="file" hidden>
   </div>
  </section>
 </main>
</div>
<div id="modal" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,getDocs,collection,query,where,orderBy,limit,onSnapshot,arrayUnion,deleteDoc,increment,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDfsUpCSADUVAZLbC8cGZOahyKbdj0WYqA",
  authDomain:"muop-vip-2026.firebaseapp.com",
  projectId:"muop-vip-2026",
  storageBucket:"muop-vip-2026.firebasestorage.app",
  messagingSenderId:"182582189633",
  appId:"1:182582189633:web:9c655e0a35e5efe163f0c0"
};
const ADMIN="admin@muopchat.app"; // tài khoản username "admin" => tích xanh
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const COMM={id:"community",community:true,isGroup:true,name:"Cộng đồng Mướp",members:[],lastAt:0,lastFrom:"",lastMsg:"Chat công khai cho mọi người",readAt:{},typing:{},pinned:{},muted:{}};
const isC=id=>id==="community",mcol=id=>isC(id)?collection(db,"community"):collection(db,"chats",id,"messages"),mref=(id,m)=>isC(id)?doc(db,"community",m):doc(db,"chats",id,"messages",m),getC=id=>isC(id)?COMM:C.find(x=>x.id===id);
let commSeen=0,me=null,U={},C=[],M=[],cur=null,watch={},mq="",t0=0,seenN={},lt=0,stick=true,uC,uM,timers=[];

const vb=v=>v?'<svg class="vb" viewBox="0 0 24 24" aria-label="Đã xác minh"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':"";
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const av=(u,z=40)=>u&&u.avatar&&u.avatar.startsWith("data:image/")?`<img class="av" style="width:${z}px;height:${z}px" src="${esc(u.avatar)}" alt="">`:`<div class="av" style="width:${z}px;height:${z}px;font-size:${z*.45}px;background:hsl(${hue(u?.username||"?")} 55% 40%)">${esc((u?.name||"?")[0].toUpperCase())}</div>`;
const grp=(z,e="👥")=>`<div class="av grp" style="width:${z}px;height:${z}px;font-size:${z*.45}px">${e}</div>`;
const on=u=>!!u&&Date.now()-(u.lastSeen||0)<45000;
const hm=d=>d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
const fmt=t=>{const d=new Date(t);return d.toDateString()===new Date().toDateString()?hm(d):d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"})+" "+hm(d)};
const toast=m=>{const e=document.createElement("div");e.id="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2800)};
const modal=h=>{const m=$("#modal");m.innerHTML=`<div class="card">${h}</div>`;m.hidden=false;m.onclick=e=>{if(e.target===m)m.hidden=true}};
const other=c=>U[c.members.find(x=>x!==me.uid)];
let replyTo=null;
const unm=()=>{const m={};Object.values(U).forEach(u=>m[u.username]=u.id);return m};
const txt=t=>{const m=unm();return esc(t).replace(/@([a-z0-9_.]{3,20})/g,(a,n)=>m[n]?`<span class="mt" data-p="${m[n]}">@${n}</span>`:a)};
const mentions=t=>{const m=unm();return[...new Set([...t.matchAll(/@([a-z0-9_.]{3,20})/g)].map(x=>m[x[1]]).filter(Boolean))]};
const rcs=m=>{const r=m.reactions||{},k={};Object.values(r).forEach(e=>k[e]=(k[e]||0)+1);const ks=Object.keys(k);return ks.length&&!m.recalled?`<div class="rcs">${ks.map(e=>`<span data-r="${e}" class="${r[me.uid]===e?"on":""}">${e}${k[e]}</span>`).join("")}</div>`:""};
const lightbox=u=>{const l=document.createElement("div");l.id="lb";l.innerHTML=`<img src="${esc(u)}" alt="">`;l.onclick=()=>l.remove();document.body.append(l)};
const cname=c=>c.isGroup?c.name:(other(c)?.name||"...");
const cnameH=c=>esc(cname(c))+(c.isGroup?"":vb(other(c)?.verified));
const theme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("th",t)}catch{}};
try{theme(localStorage.getItem("th")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))}catch{}
$("#thm").onclick=()=>theme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* ---------- Auth ---------- */
let reg=false;
const err=m=>$("#er").textContent=m;
$("#sw").onclick=()=>{reg=!reg;$("#dn").hidden=!reg;$("#sub").textContent=reg?"Tạo tài khoản mới":"Đăng nhập để trò chuyện";$("#sb").textContent=reg?"Đăng ký":"Đăng nhập";$("#sw").textContent=reg?"Đã có tài khoản? Đăng nhập":"Chưa có tài khoản? Đăng ký";err("")};
$("#af").onsubmit=async e=>{
  e.preventDefault();err("");
  const u=$("#un").value.trim().toLowerCase(),p=$("#pw").value,n=$("#dn").value.trim(),em=u+"@muopchat.app";
  if(!/^[a-z0-9_.]{3,20}$/.test(u))return err("Username 3-20 ký tự: a-z, 0-9, _ .");
  if(p.length<6)return err("Mật khẩu tối thiểu 6 ký tự");
  if(reg&&!n)return err("Hãy nhập tên hiển thị");
  $("#sb").disabled=true;
  try{
    if(reg){
      const r=await createUserWithEmailAndPassword(auth,em,p);
      await setDoc(doc(db,"users",r.user.uid),{username:u,name:n.slice(0,40),status:"Xin chào! 👋",avatar:"",verified:em===ADMIN,lastSeen:Date.now(),createdAt:Date.now()});
    }else await signInWithEmailAndPassword(auth,em,p);
  }catch(x){
    const c=x.code||"";
    err(c.includes("email-already")?"Username đã tồn tại":/invalid-credential|wrong-password|user-not-found/.test(c)?"Sai username hoặc mật khẩu":c.includes("too-many")?"Thử quá nhiều lần, hãy đợi vài phút":c.includes("operation-not-allowed")?"Chưa bật Email/Password trong Firebase Authentication":"Lỗi: "+(x.message||c));
  }
  $("#sb").disabled=false;
};
onAuthStateChanged(auth,u=>{if(u&&!me)start(u)});

async function start(u){
  let s;
  for(let i=0;i<10;i++){s=await getDoc(doc(db,"users",u.uid));if(s.exists())break;await sleep(400)}
  if(!s.exists())return err("Không tải được hồ sơ, hãy thử lại");
  me={uid:u.uid};t0=Date.now();
  watchUser(u.uid);
  $("#auth").hidden=true;$("#app").hidden=false;
  if("Notification" in window&&Notification.permission==="default")Notification.requestPermission();
  const beat=()=>updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()}).catch(()=>{});
  beat();timers.push(setInterval(beat,20000),setInterval(draw,15000),setInterval(()=>cur&&drawHead(),2000));
  addEventListener("pagehide",()=>updateDoc(doc(db,"users",me.uid),{lastSeen:0}).catch(()=>{}));
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){beat();markRead()}});
  uC=onSnapshot(query(collection(db,"chats"),where("members","array-contains",me.uid)),s=>{
    s.docChanges().forEach(ch=>{
      if(ch.type==="removed")return;
      const c=ch.doc.data();c.members.forEach(watchUser);
      const k=ch.doc.id+c.lastAt;
      if(c.lastFrom&&c.lastFrom!==me.uid&&c.lastAt>t0&&!c.muted?.[me.uid]&&(ch.doc.id!==cur||document.hidden)&&!seenN[k]){
        seenN[k]=1;const who=c.isGroup?c.name:(U[c.lastFrom]?.name||"Tin nhắn mới");
        try{if(Notification.permission==="granted")new Notification(who,{body:c.lastMsg})}catch{}
        toast(`💬 ${who}: ${c.lastMsg}`);
      }
    });
    C=s.docs.map(d=>({id:d.id,...d.data()}));
    draw();if(cur){drawHead();renderMsgs();markRead()}
  },e=>toast("Lỗi tải cuộc trò chuyện: "+e.code));
  onSnapshot(query(collection(db,"community"),orderBy("at","desc"),limit(1)),s=>{
    const d=s.docs[0]?.data();if(!d)return;
    Object.assign(COMM,{lastAt:d.at,lastFrom:d.from,lastMsg:d.recalled?"Tin nhắn đã bị thu hồi":d.type==="text"?d.text.slice(0,60):d.type==="image"?"📷 Hình ảnh":"📎 "+(d.name||"")});
    watchUser(d.from);
    if(d.mentions?.includes(me.uid)&&d.from!==me.uid&&d.at>t0&&!seenN["m"+d.at]){seenN["m"+d.at]=1;toast("📣 "+(U[d.from]?.name||"Ai đó")+" đã nhắc đến bạn")}
    if(cur==="community"&&!document.hidden)commSeen=d.at;

const OKEXT=/\.(pdf|txt|zip|docx?|xlsx?|pptx?|csv|mp3)$/i;
async function fit(f,max){for(const[z,q]of[[1800,.88],[1600,.82],[1400,.76],[1200,.7],[1000,.64],[800,.55]]){const d=await shrink(f,z,q);if(d.length<=max)return d}throw "Ảnh quá lớn, hãy chọn ảnh nhỏ hơn"}
function shrink(f,max,q){
  return new Promise((ok,no)=>{
    const im=new Image(),url=URL.createObjectURL(f);
    im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL("image/jpeg",q))};
    im.onerror=()=>no("Ảnh không hợp lệ");im.src=url;
  });
}
$("#file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!cur)return;
  try{
    if(f.type.startsWith("image/")){
      if(!/^image\/(jpeg|png|gif|webp)$/.test(f.type))throw "Chỉ hỗ trợ ảnh JPG, PNG, GIF, WEBP";
      if(f.size>10*1048576)throw "Ảnh tối đa 10MB";
      const d=await fit(f,900000);
      await send({type:"image",data:d,name:f.name.slice(0,60)});
    }else{
      if(!OKEXT.test(f.name))throw "Loại tệp không được hỗ trợ (pdf, txt, zip, doc, xls, ppt, csv, mp3)";
      if(f.size>600*1024)throw "Tệp tối đa 600KB";
      const d=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
      await send({type:"file",data:d,name:f.name.slice(0,60),size:f.size});
    }
  }catch(x){toast(typeof x==="string"?x:"Gửi tệp thất bại")}
};

    $("#ppost").disabled=false;
  };
  uF=onSnapshot(query(collection(db,"posts"),orderBy("at","desc"),limit(30)),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));P.forEach(p=>{watchUser(p.from);p.shareOf&&watchUser(p.shareOf.from)});drawPosts()},e=>toast("Lỗi tải bảng tin: "+e.code));
}
function postHTML(p){
  const u=U[p.from],r=p.reactions||{},k={};Object.values(r).forEach(e=>k[e]=(k[e]||0)+1);
  const mine=r[me.uid],n=Object.keys(r).length,sh=p.shareOf,adm=U[me.uid]?.verified;
  return `<div class="card2 post" data-pid="${p.id}"><div class="ph" data-p="${p.from}">${av(u,40)}<div class="mid"><b>${esc(u?.name||"...")}${vb(u?.verified)}</b><small>${fmt(p.at)}${sh?" · đã chia sẻ":""}</small></div>${p.from===me.uid||adm?`<button data-pa="del" title="Xóa bài">🗑</button>`:""}</div>${p.text?`<div class="pt">${txt(p.text)}</div>`:""}${imgH(p.img)}${sh?`<div class="shr"><div class="ph" data-p="${esc(sh.from)}">${av(U[sh.from],32)}<b>${esc(U[sh.from]?.name||"")}${vb(U[sh.from]?.verified)}</b></div>${sh.text?`<div class="pt">${txt(sh.text)}</div>`:""}${imgH(sh.img)}</div>`:""}<div class="pst"><span>${n?Object.keys(k).join("")+" "+n:""}</span><span>${p.cc>0?p.cc+" bình luận":""}${p.shares>0?" · "+p.shares+" chia sẻ":""}</span></div><div class="pbar"><button data-pa="like" class="${mine==="👍"?"on":""}">👍 Thích</button><button data-pa="heart" class="${mine==="❤️"?"on":""}">❤️ Tim</button><button data-pa="cm">💬 Bình luận</button><button data-pa="share">↪ Chia sẻ</button></div>${openC.has(p.id)?`<div>${(CM[p.id]||[]).map(c=>`<div class="cmt"><span data-p="${c.from}" style="cursor:pointer">${av(U[c.from],30)}</span><div><div class="bx"><b data-p="${c.from}" style="cursor:pointer">${esc(U[c.from]?.name||"...")}${vb(U[c.from]?.verified)}</b><div>${txt(c.text)}</div></div><small style="color:var(--s)">${fmt(c.at)}${c.from===me.uid||adm?` · <a data-pa="dc" data-cid="${c.id}" style="cursor:pointer">Xóa</a>`:""}</small></div></div>`).join("")}<div class="cin"><input data-ci="${p.id}" placeholder="Viết bình luận... (@username để nhắc)" maxlength="500" value="${esc(drafts[p.id]||"")}"><button data-pa="send" style="color:var(--g)">➤</button></div></div>`:""}</div>`;
}
function keepFocus(box,f){
  const id=document.activeElement?.dataset?.ci;f();
  if(id){const n=box.querySelector(`[data-ci="${id}"]`);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}
}
function drawPosts(){const l=$("#plist");if(!l)return;keepFocus(l,()=>l.innerHTML=P.length?P.map(postHTML).join(""):'<p class="emp">Chưa có bài viết nào. Hãy là người đăng đầu tiên!</p>')}
function subC(id){
  if(!openC.has(id)){uCM[id]&&uCM[id]();delete uCM[id];return}
  if(uCM[id])return;
  uCM[id]=onSnapshot(query(collection(db,"posts",id,"comments"),orderBy("at","asc"),limit(50)),s=>{CM[id]=s.docs.map(d=>({id:d.id,...d.data()}));CM[id].forEach(c=>watchUser(c.from));redraw()});
}
document.addEventListener("click",async e=>{
  const im=e.target.closest(".pimg");if(im&&im.src){lightbox(im.src);return}
  const pa=e.target.closest("[data-pa]");
  if(pa){
    const el=pa.closest(".post"),pid=el?.dataset.pid,p=[...P,...PP].find(x=>x.id===pid),a=pa.dataset.pa;
    if(!p)return;const ref=doc(db,"posts",pid);
    if(a==="like"||a==="heart"){const em=a==="like"?"👍":"❤️";updateDoc(ref,{["reactions."+me.uid]:p.reactions?.[me.uid]===em?deleteField():em}).catch(()=>toast("Không thể thả cảm xúc"))}
    else if(a==="cm"){openC.has(pid)?openC.delete(pid):openC.add(pid);subC(pid);redraw()}
    else if(a==="send"){const inp=el.querySelector("[data-ci]"),t=inp.value.trim();if(!t)return;inp.value="";drafts[pid]="";try{await addDoc(collection(db,"posts",pid,"comments"),{from:me.uid,text:t.slice(0,500),at:Date.now()});updateDoc(ref,{cc:increment(1)}).catch(()=>{})}catch{toast("Không gửi được bình luận")}}
    else if(a==="dc"){deleteDoc(doc(db,"posts",pid,"comments",pa.dataset.cid)).then(()=>updateDoc(ref,{cc:increment(-1)})).catch(()=>toast("Không thể xóa"))}
    else if(a==="del"){if(confirm("Xóa bài viết này?"))deleteDoc(ref).catch(()=>toast("Không thể xóa"))}
    else if(a==="share"){
      const cap=prompt("Viết gì đó về bài này (có thể bỏ trống):");if(cap===null)return;
      const b=p.shareOf||{id:pid,from:p.from,text:p.text||"",img:p.img||""};
      try{await addDoc(collection(db,"posts"),{from:me.uid,text:cap.slice(0,3000),at:Date.now(),reactions:{},cc:0,shares:0,shareOf:b});updateDoc(doc(db,"posts",b.id),{shares:increment(1)}).catch(()=>{});toast("Đã chia sẻ lên trang của bạn")}catch{toast("Chia sẻ thất bại")}
    }
    return;
  }
  const pp=e.target.closest("[data-p]");
  if(pp&&!e.target.closest("#msgs,#hd"))openProfile(pp.dataset.p);
});
document.addEventListener("input",e=>{const id=e.target.dataset?.ci;if(id)drafts[id]=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset?.ci)e.target.closest(".post").querySelector('[data-pa="send"]').click()});

/* ---------- Trang cá nhân ---------- */
function openProfile(id){
  if(!id||id==="undefined"||!me)return;
  profId=id;watchUser(id);uPP&&uPP();
  modal('<div id="pbox"></div>');
  const m=$("#modal");m.querySelector(".card").style.width="min(560px,94vw)";
  m.onclick=e=>{if(e.target===m){m.hidden=true;uPP&&uPP();uPP=null;profId=null}};
  PP=[];
  uPP=onSnapshot(query(collection(db,"posts"),where("from","==",id),limit(30)),s=>{PP=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at);PP.forEach(p=>p.shareOf&&watchUser(p.shareOf.from));drawProf()},()=>{});
  drawProf();
}
function drawProf(){
  const b=$("#pbox");if(!b||$("#modal").hidden||!profId)return;
  const u=U[profId];if(!u){b.innerHTML='<p class="emp">Đang tải...</p>';return}
  keepFocus(b,()=>{
    b.innerHTML=`<div class="prof">${av(u,88)}<h3>${esc(u.name)}${vb(u.verified)}</h3><small style="color:var(--s)">@${esc(u.username)} · ${on(u)?"🟢 Đang hoạt động":"Ngoại tuyến"}</small><div>${esc(u.status||"")}</div>${profId===me.uid?'<button class="pri" id="ps" style="width:auto;padding:0 20px">Chỉnh sửa hồ sơ</button>':'<button class="pri" id="pm" style="width:auto;padding:0 20px">💬 Nhắn tin</button>'}</div><h4 style="margin:12px 0 8px">Bài viết</h4>${PP.length?PP.map(postHTML).join(""):'<p class="emp">Chưa có bài viết nào</p>'}`;
    $("#pm")&&($("#pm").onclick=()=>start11(profId));
    $("#ps")&&($("#ps").onclick=settings);
  });
}

/* ---------- Cài đặt ---------- */
function settings(){
  const u=U[me.uid];let nav=u.avatar||"";
  modal(`<h3>Cài đặt tài khoản</h3><div class="setrow"><span id="pv">${av(u,64)}</span><button id="pick" style="width:auto;padding:0 14px;border-radius:20px;font-size:14px;background:var(--pn)">Đổi ảnh đại diện</button><input type="file" id="af2" accept="image/*" hidden></div><div><b>${esc(u.name)}</b>${vb(u.verified)}<br><small style="color:var(--s)">@${esc(u.username)}${u.verified?" · Quản trị viên đã xác minh":""}</small></div><input id="sn" value="${esc(u.name)}" maxlength="40" placeholder="Tên hiển thị"><input id="ss" value="${esc(u.status)}" maxlength="80" placeholder="Trạng thái của bạn"><div class="setrow"><span style="flex:1">Giao diện</span><button id="tt" style="width:auto;padding:0 14px;border-radius:20px;font-size:14px;background:var(--pn)">${document.documentElement.dataset.theme==="dark"?"🌙 Tối":"☀️ Sáng"}</button></div><button class="pri" id="sv">Lưu thay đổi</button><button id="lo" style="width:100%;border-radius:22px;color:#dc2626;font-size:15px">Đăng xuất</button>`);
  $("#pick").onclick=()=>$("#af2").click();
  $("#af2").onchange=async e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return toast("Hãy chọn một ảnh");try{nav=await shrink(f,200,.8);$("#pv").innerHTML=av({...u,avatar:nav},64)}catch(x){toast(String(x))}};
  $("#tt").onclick=()=>{theme(document.documentElement.dataset.theme==="dark"?"light":"dark");$("#tt").textContent=document.documentElement.dataset.theme==="dark"?"🌙 Tối":"☀️ Sáng"};
  $("#sv").onclick=async()=>{
    const n=$("#sn").value.trim();if(!n)return toast("Tên không được để trống");
    try{await updateDoc(doc(db,"users",me.uid),{name:n.slice(0,40),status:$("#ss").value.trim().slice(0,80),avatar:nav});$("#modal").hidden=true;toast("Đã lưu")}catch{toast("Lưu thất bại")}
  };
  $("#lo").onclick=async()=>{
    try{await updateDoc(doc(db,"users",me.uid),{lastSeen:0})}catch{}
    timers.forEach(clearInterval);await signOut(auth);location.reload();
  };
}
</script>
</body>
</html>
